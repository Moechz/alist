<!DOCTYPE html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AList File Manager</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #101418; color: #d8dee6;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  .card { text-align: center; }
  .cloud {
    width: 110px; height: 70px; margin: 0 auto 22px; border-radius: 40px;
    background: linear-gradient(135deg, #70c6be 0%, #4aa8a0 100%);
    box-shadow: 0 6px 30px rgba(112, 198, 190, .35);
    position: relative;
    animation: float 3s ease-in-out infinite;
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: inherit; border-radius: 50%;
  }
  .cloud::before { width: 46px; height: 46px; top: -22px; left: 20px; }
  .cloud::after  { width: 34px; height: 34px; top: -14px; right: 22px; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  a { color: #7dd6cf; }
</style>
</head>
<body>
  <div class="card">
    <div class="cloud"></div>
    <p>正在打开 AList（版本 @@VERSION@@）…</p>
    <p>若未自动跳转，请点击 <a href="/alist/">/alist/</a></p>
  </div>
  <script>location.replace('/alist/');</script>
</body>
</html>
