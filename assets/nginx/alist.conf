# AList for TOS 7 — nginx 反代（WebUI External Open / 新标签页模式）
# 官方模板: help.terra-master.com → Deb Development Specification → Nginx Configuration
# 安装位置: /usr/local/alist/nginx/alist.conf
# 平台将其加载进 TOS nginx；location 前缀必须与 config.ini 的 path 一致
#
# 前缀保留转发（navidrome 同款方案）：AList 通过 site_url 的路径部分
# 原生运行在子路径（服务端路由组挂 /alist 前缀，前端 base_path 注入），
# SPA/API/WebDAV/直链全部自洽；不要写 proxy_pass http://127.0.0.1:15244/
# （尾斜杠会剥离前缀，前端绝对路径将全部 404）
location /alist/ {
    proxy_pass http://127.0.0.1:15244/alist/;
    proxy_http_version 1.1;
    # Host 用 $http_host（带端口）：AList 依据 Host/site_url 生成分享等
    # 绝对 URL，用 $host（不含端口）会生成丢端口的错误链接
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket 升级（前端实时进度/事件流需要）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # 大文件上传/下载/在线解压耗时较长
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # 流式响应不缓冲（视频拖动即点即播、下载直吐）
    proxy_buffering off;
    # 上传不设限（nginx 默认 client_max_body_size 1m 会掐断 AList 上传）
    client_max_body_size 0;
}
# 隐私政策（审核 C3）：精确匹配优先于前缀反代，直接从安装目录回静态文件
location = /alist/privacy-policy.html {
    alias /usr/local/alist/privacy-policy.html;
    default_type text/html;
}
# 无尾斜杠访问补一个 301（用户手输地址的容错）
# absolute_redirect off: 输出相对 Location，避免 TOS nginx 构造绝对 URL 时
# 丢失端口（实测 port_in_redirect 环境下会踢到 80 端口）
location = /alist {
    absolute_redirect off;
    return 301 /alist/;
}
